<svg xmlns="http://www.w3.org/2000/svg" width="1212" height="410" viewBox="-6 0 1212 410"><line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#2A3038"/><text x="0" y="40" fill="#FF5A1F" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:15px;font-weight:600;letter-spacing:2px">01</text><text x="40" y="40" fill="#7D8590" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:15px;font-weight:500;letter-spacing:3px">ABOUT</text><text x="0" y="110" fill="#F0F0F0" text-anchor="start" style="font-family:Georgia, 'Times New Roman', 'Iowan Old Style', serif;font-size:38px;font-weight:400;letter-spacing:-0.5px">Full-stack developer &amp; AI/ML engineer.</text><text x="0" y="158" fill="#7D8590" text-anchor="start" style="font-family:Georgia, 'Times New Roman', 'Iowan Old Style', serif;font-size:38px;font-weight:400;letter-spacing:-0.5px;font-style:italic">I take AI out of the notebook and into</text><text x="0" y="206" fill="#7D8590" text-anchor="start" style="font-family:Georgia, 'Times New Roman', 'Iowan Old Style', serif;font-size:38px;font-weight:400;letter-spacing:-0.5px;font-style:italic">products people actually use.</text><text x="0" y="262" fill="#B4BCC4" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:18px;font-weight:400;letter-spacing:0px">Computer-vision pipelines that run on live video, LLM systems that talk instead of just chat,</text><text x="0" y="290" fill="#B4BCC4" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:18px;font-weight:400;letter-spacing:0px">and the full-stack plumbing that holds it all together.</text><line x1="0" y1="330" x2="276" y2="330" stroke="#2A3038"/><text x="0" y="360" fill="#7D8590" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:12px;font-weight:500;letter-spacing:2.5px">BASED IN</text><text x="0" y="390" fill="#F0F0F0" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:19px;font-weight:500;letter-spacing:0px">Ahmedabad, India</text><line x1="300" y1="330" x2="576" y2="330" stroke="#2A3038"/><text x="300" y="360" fill="#7D8590" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:12px;font-weight:500;letter-spacing:2.5px">STUDYING</text><text x="300" y="390" fill="#F0F0F0" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:19px;font-weight:500;letter-spacing:0px">Int. M.Sc IT · Year 5</text><line x1="600" y1="330" x2="876" y2="330" stroke="#2A3038"/><text x="600" y="360" fill="#7D8590" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:12px;font-weight:500;letter-spacing:2.5px">FOCUS</text><text x="600" y="390" fill="#F0F0F0" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:19px;font-weight:500;letter-spacing:0px">Vision · LLMs · Voice</text><line x1="900" y1="330" x2="1176" y2="330" stroke="#2A3038"/><text x="900" y="360" fill="#7D8590" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:12px;font-weight:500;letter-spacing:2.5px">BUILDING</text><text x="900" y="390" fill="#F0F0F0" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:19px;font-weight:500;letter-spacing:0px">VoiceForm AI</text></svg>
