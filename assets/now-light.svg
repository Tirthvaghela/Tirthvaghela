<svg xmlns="http://www.w3.org/2000/svg" width="1212" height="340" viewBox="-6 0 1212 340"><line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#E4E4E4"/><text x="0" y="40" fill="#FF4F00" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:15px;font-weight:600;letter-spacing:2px">02</text><text x="40" y="40" fill="#8A8A8A" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:15px;font-weight:500;letter-spacing:3px">NOW BUILDING</text><text x="1200" y="40" fill="#8A8A8A" text-anchor="end" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:15px;font-weight:500;letter-spacing:3px">IN PROGRESS</text><circle cx="1054" cy="35" r="4" fill="#FF4F00"/><text x="0" y="128" fill="#111111" text-anchor="start" style="font-family:Georgia, 'Times New Roman', 'Iowan Old Style', serif;font-size:64px;font-weight:400;letter-spacing:-2px">VoiceForm AI</text><text x="0" y="176" fill="#4A4A4A" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:19px;font-weight:400;letter-spacing:0px">Fill any form just by talking. It reads a paper or PDF form, turns it into a spoken</text><text x="0" y="204" fill="#4A4A4A" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:19px;font-weight:400;letter-spacing:0px">conversation in English, Hindi or Gujarati, and writes the answers back onto the original layout.</text><rect x="0.5" y="250" width="216.6" height="74" rx="8" fill="#FFFFFF" stroke="#E4E4E4" stroke-width="1"/><text x="18.0" y="278" fill="#8A8A8A" text-anchor="start" style="font-family:'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;font-size:12px;font-weight:600;letter-spacing:2px">01</text><text x="18.0" y="304" fill="#111111" text-anchor="start" style="font-family:'Helvetica Neue', 'Segoe UI', Arial, sans-serif;font-size:18px;font-weight